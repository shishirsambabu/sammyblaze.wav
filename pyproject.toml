[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sammyblaze-wav"
version = "0.1.0"
description = "A local-first hand-controlled musical instrument"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<7",
  "ruff>=0.6,<1",
]
vision = [
  "opencv-python>=4.9,<5",
  "mediapipe>=0.10,<1",
]
midi = [
  "mido>=1.3,<2",
]
midi-native = [
  "python-rtmidi>=1.5,<2",
]
audio = [
  "pyfluidsynth>=1.3,<2",
]
ml = [
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
]
ui = [
  "PySide6>=6.7,<7",
]

[project.scripts]
handmusic = "handmusic.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
